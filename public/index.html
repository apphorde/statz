<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Stats</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://--li3.static.apphor.de/",
          "@sodium/": "https://--sodium.static.apphor.de/",
          "@lucide/": "https://--lucide.static.apphor.de/",
          "app": "/ui/index.js"
        }
      }
    </script>
    <script type="module">
      import "@li3/web";
      import "@lucide/lucide-icon";
    </script>
  </head>
  <body class="bg-gray-700 text-white">
    <template component="st-panel">
      <script setup>
        import { defineProp, defineEvent } from "@li3/web";
        import { signal, effect } from "@li3/reactive";

        export default function () {
          defineProp("icon");
          defineProp("title");
          const filters = defineProp("filters", {
            default() {
              return [];
            },
          });

          const filterToggles = signal({});
          const onFilter = defineEvent("filter");
          const onRefresh = defineEvent("refresh");

          effect(() => {
            if (filters.value) {
              filterToggles.value = {};
            }
          });

          function toggleFilter(f) {
            filterToggles.value[f] = !filterToggles.value[f];
            const t = filterToggles.value;
            onFilter(Object.keys(t).filter((k) => t[k]));
          }

          return { onRefresh, toggleFilter, filterToggles };
        }
      </script>
      <div class="bg-white/10 p-6 rounded-lg shadow-md text-gray-200 h-full">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-medium flex items-center">
            <span class="mr-4"> {{ title }} </span>
            <template for="filter of filters">
              <button
                class="text-sm border bg-gray-800 p-1 mr-1"
                class-bg-green-400="filterToggles[filter]"
                on-click="toggleFilter(filter)"
                bind-inner-text="filter"
              ></button>
            </template>
          </h2>
          <button on-click="onRefresh()">
            <lucide-icon prop-icon="icon"></lucide-icon>
          </button>
        </div>
        <slot></slot>
      </div>
    </template>

    <template component="st-usage">
      <div class="text-2xl font-bold flex items-center justify-between">
        <span>{{ usedLabel }} / {{ totalLabel }}</span>
        <span class="text-xs text-gray-300">{{ freeLabel }} free</span>
      </div>

      <div class="mt-2 bg-gray-200 rounded-full h-2">
        <div
          bind-class-name="classList"
          style-width="`${ (used / total) * 100}%`"
        ></div>
      </div>

      <script setup>
        import { defineProp } from "@li3/web";
        import { effect } from "@li3/reactive";
        import { toDecimal, toMB, toGB, oneGB, oneMB } from "app";

        export default function stUsage() {
          const total = defineProp("total");
          const used = defineProp("used");
          const free = defineProp("free");

          const fx = (source) =>
            effect(() => {
              const v = source.value;
              if (v >= oneGB) {
                return toDecimal(toGB(v)) + "GB";
              }

              if (v >= oneMB) {
                return toDecimal(toMB(v)) + "MB";
              }

              return toDecimal(v) + "b";
            });

          const totalLabel = fx(total);
          const usedLabel = fx(used);
          const freeLabel = fx(free);

          const classList = effect(() => {
            const amount = Math.floor(100 * (free / total));
            const base = "rounded-full h-2 ";

            if (amount < 10) {
              return base + "bg-red-500";
            }

            if (amount < 25) {
              return base + "bg-orange-500";
            }

            return base + "bg-green-500";
          });

          return { totalLabel, usedLabel, freeLabel, classList };
        }
      </script>
    </template>

    <template app>
      <div class="p-8 min-h-screen flex flex-col items-stretch">
        <h1 class="flex items-center justify-between w-full mb-6">
          <span class="text-3xl font-bold text-gray-100">Server Dashboard</span>
          <div>
            <button
              class="cursor-pointer"
              bind-value="autoRefresh"
              on-click="onToggleRefresh()"
              class-text-green-400="autoRefresh"
              class-text-red-400="!autoRefresh"
            >
              <lucide-icon
                prop-icon="autoRefresh ? 'refresh-cw' : 'refresh-cw-off'"
              ></lucide-icon>
            </button>
            <button class="cursor-pointer" on-click="onUpdateApp()">
              <lucide-icon icon="hard-drive-download"></lucide-icon>
            </button>
          </div>
        </h1>

        <div class="grid gap-6 md:grid-cols-2 mb-6 w-full">
          <!-- lg:grid-cols-3 -->
          <!-- st-panel
            icon="network"
            title="Network Usage"
            on-refresh="refreshNetwork()"
          >
            <div class="text-2xl font-bold">
              {{ networkUsage.download | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↓ Download</p>
            <div class="mt-4 text-2xl font-bold">
              {{ networkUsage.upload | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↑ Upload</p>
          </st-panel -->

          <st-panel
            icon="memory-stick"
            title="Memory Usage"
            on-refresh="refreshMemory()"
          >
            <st-usage
              class="block"
              prop-used="memoryUsage.used"
              prop-total="memoryUsage.total"
              prop-free="memoryUsage.free"
            ></st-usage>
            <na-chart
              bind-options="{animate:false, truncateLegends:true}"
              bind-inputs="history.memory"
              class="block bg-white rounded overflow-hidden mt-6"
            ></na-chart>
          </st-panel>

          <st-panel icon="cpu" title="CPU Usage" on-refresh="refreshCpu()">
            <div
              class="text-2xl mb-2 font-bold text-white flex items-center justify-between"
            >
              <span> {{ cpuUsage.loadAverage[0] }} </span>
              <span> {{ cpuUsage.loadAverage[1] }} </span>
              <span> {{ cpuUsage.loadAverage[2] }} </span>
            </div>
            <div class="bg-gray-200 rounded-full h-2 mb-6">
              <div
                class="bg-red-500 rounded-full h-2"
                style-width="`${cpuUsage.loadAverage[0] / cpuUsage.cpus.length * 100}%`"
              ></div>
            </div>
            <na-chart
              bind-inputs="history.cpu"
              class="block bg-white rounded overflow-hidden"
            ></na-chart>
          </st-panel>
        </div>

        <st-panel
          class="mb-6 w-full block"
          icon="hard-drive"
          title="Disk Usage"
          on-refresh="refreshDisk()"
          prop-filters="fileSystems"
          on-filter="onDiskFilter($event.detail)"
        >
          <div class="w-full">
            <template for="disk of diskUsage">
              <div
                class="flex flex-col sm:flex-row justify-between mb-2 rounded-md border border-gray-500 p-2 sm:space-x-4"
              >
                <div class="sm:w-1/3">
                  <span
                    class="block whitespace-nowrap font-bold text-ellipsis w-full overflow-hidden"
                    >{{ disk.mountpoint }}</span
                  >
                  <span
                    class="whitespace-nowrap text-xs text-ellipsis w-full overflow-hidden"
                    >{{ disk.device }}</span
                  >
                </div>
                <st-usage
                  class="block w-full sm:w-2/3"
                  prop-used="disk.used"
                  prop-total="disk.total"
                  prop-free="disk.available"
                ></st-usage>
              </div>
            </template>
          </div>
        </st-panel>

        <st-panel
          class="mb-6 w-full block"
          icon="cpu"
          title="Top processes"
          on-refresh="refreshProcesses()"
        >
          <div class="w-full overflow-x-auto font-mono">
            <table class="w-full">
              <thead>
                <tr>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    pid
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    User
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    %CPU
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    %Mem
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Time
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Command
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 text-sm whitespace-nowrap">
                <template for="process of ps">
                  <tr>
                    <td class="p-2">{{ process.pid }}</td>
                    <td class="p-2">{{ process.user }}</td>
                    <td class="p-2">{{ process.cpu }}</td>
                    <td class="p-2">{{ process.mem }}</td>
                    <td class="p-2">{{ process.time }}</td>
                    <td class="p-2">{{ process.command }}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </st-panel>
      </div>

      <script setup src="/ui/index.js"></script>
    </template>
  </body>
</html>
