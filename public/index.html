<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Stats</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script type="importmap">
      {
        "imports": {
          "@lithium/": "https://--lithium.static.apphor.de/",
          "@sodium/": "https://--sodium.static.apphor.de/",
          "@lucide/": "https://--lucide.static.apphor.de/"
        }
      }
    </script>
    <script type="module" src="/ui/components.mjs"></script>
  </head>
  <body class="bg-gray-700 text-white">
    <template>
      <div class="p-8 min-h-screen">
        <h1 class="text-3xl font-bold mb-6 text-gray-100">Server Dashboard</h1>

        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 mb-6">
          <st-panel
            icon="network"
            title="Network Usage"
            on-refresh="refreshNetwork()"
          >
            <div class="text-2xl font-bold text-gray-300">
              {{ networkUsage.download }} Mbps
            </div>
            <p class="text-xs text-gray-500">↓ Download</p>
            <div class="mt-4 text-2xl font-bold text-gray-300">
              {{ networkUsage.upload }} Mbps
            </div>
            <p class="text-xs text-gray-500">↑ Upload</p>
          </st-panel>

          <st-panel
            icon="memory-stick"
            title="Memory Usage"
            on-refresh="refreshMemory()"
          >
            <div class="text-2xl font-bold text-gray-700">
              {{ toDecimal(memoryUsage.used / oneMB) }} MB / {{
              toDecimal(memoryUsage.total / oneMB) }} MB
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
              <div
                class="bg-green-500 rounded-full h-2"
                style-width="`${ (memoryUsage.used / memoryUsage.total) * 100}%`"
              ></div>
            </div>
            <p class="text-xs text-gray-300 mt-2">
              {{ toDecimal(memoryUsage.free / oneMB) }} MB free
            </p>
          </st-panel>

          <st-panel icon="cpu" title="CPU Usage" on-refresh="refreshCpu()">
            <div
              class="text-2xl mb-2 font-bold text-white flex items-center justify-between"
            >
              <span> {{ cpuUsage.loadAverage[0] }} </span>
              <span> {{ cpuUsage.loadAverage[1] }} </span>
              <span> {{ cpuUsage.loadAverage[2] }} </span>
            </div>
            <div class="bg-gray-200 rounded-full h-2">
              <div
                class="bg-red-500 rounded-full h-2"
                style-width="`${cpuUsage.loadAverage[0]}%`"
              ></div>
            </div>
          </st-panel>
        </div>

        <st-panel
          icon="hard-drive"
          title="Disk Usage"
          on-refresh="refreshDisk()"
        >
          <table class="w-full">
            <thead>
              <tr>
                <th
                  class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                >
                  Use
                </th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                >
                  Free
                </th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                >
                  Path
                </th>
                <th
                  class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                ></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              <template for="disk of diskUsage">
                <tr>
                  <td class="px-6 py-4 whitespace-nowrap text-sm">
                    {{ toDecimal(disk.used / oneGB) }} GB / {{
                    toDecimal(disk.total / oneGB) }} GB
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm">
                    {{ toDecimal(disk.available / oneGB) }} GB
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm">
                    {{ disk.mountpoint }}
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </st-panel>

        <div class="mb-6 bg-white/10 rounded-lg shadow-md overflow-hidden">
          <div class="p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-2">
              Running Processes
            </h2>
            <p class="text-sm text-gray-600 mb-4">
              A list of currently running processes on the server.
            </p>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-white/20">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    PID
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Name
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    CPU Usage
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Memory Usage
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template>
                  <tr key="{process.pid}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                      {{process.pid}}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                      {{process.name}}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                      {{process.cpu}}%
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                      {{process.memory}} MB
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
    <script type="module">
      import { ref, onInit, domReady, mount } from "@lithium/web";

      const oneMB = 1048576;
      const oneGB = oneMB * 1024;

      function setup() {
        const process = ref({});
        const cpuUsage = ref({
          loadAverage: [],
        });
        const memoryUsage = ref({});

        const networkUsage = ref({
          download: 0,
          upload: 0,
        });

        const diskUsage = ref({
          total: 0,
          used: 0,
          available: 0,
          mountpoint: "/",
        });

        function refreshDisk() {
          stat("/disk", diskUsage);
        }

        function refreshMemory() {
          stat("/memory", memoryUsage);
        }

        function refreshCpu() {
          stat("/cpu", cpuUsage);
        }

        function refreshNetwork() {
          stat("/network", networkUsage);
        }

        function refresh() {
          refreshMemory();
          refreshDisk();
          refreshCpu();
          refreshNetwork();
        }

        function toDecimal(value) {
          return Number(value).toFixed(2);
        }

        async function stat(apiPath, target) {
          const req = await fetch(apiPath);
          target.value = await req.json();
        }

        onInit(refresh);

        return {
          refresh,
          refreshCpu,
          refreshDisk,
          refreshMemory,
          refreshNetwork,
          toDecimal,
          cpuUsage,
          diskUsage,
          networkUsage,
          memoryUsage,
          process,
          oneMB,
          oneGB,
        };
      }

      domReady().then(function () {
        const template = document.querySelector("template");
        mount("body", { template, setup });
      });
    </script>
  </body>
</html>
