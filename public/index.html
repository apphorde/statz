<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Stats</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script type="importmap">
      {
        "imports": {
          "@lithium/": "https://--lithium.static.apphor.de/",
          "@sodium/": "https://--sodium.static.apphor.de/",
          "@lucide/": "https://--lucide.static.apphor.de/"
        }
      }
    </script>
    <script type="module" src="/ui/components.mjs"></script>
  </head>
  <body class="bg-gray-700 text-white">
    <template>
      <div class="p-8 min-h-screen">
        <h1 class="text-3xl font-bold mb-6 text-gray-100">Server Dashboard</h1>

        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 mb-6">
          <st-panel
            icon="network"
            title="Network Usage"
            on-refresh="refreshNetwork()"
          >
            <div class="text-2xl font-bold">
              {{ networkUsage.download | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↓ Download</p>
            <div class="mt-4 text-2xl font-bold">
              {{ networkUsage.upload | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↑ Upload</p>
          </st-panel>

          <st-panel
            icon="memory-stick"
            title="Memory Usage"
            on-refresh="refreshMemory()"
          >
            <div class="text-2xl font-bold">
              {{ toDecimal(memoryUsage.used / oneMB) }} MB / {{
              toDecimal(memoryUsage.total / oneMB) }} MB
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
              <div
                class="bg-green-500 rounded-full h-2"
                style-width="`${ (memoryUsage.used / memoryUsage.total) * 100}%`"
              ></div>
            </div>
            <p class="text-xs text-gray-300 mt-2">
              {{ toDecimal(memoryUsage.free / oneMB) }} MB free
            </p>
            <na-chart
              bind-options="{animate:false, truncateLegends:true}"
              bind-inputs="history.memory"
              class="block bg-white rounded"
            ></na-chart>
          </st-panel>

          <st-panel icon="cpu" title="CPU Usage" on-refresh="refreshCpu()">
            <div
              class="text-2xl mb-2 font-bold text-white flex items-center justify-between"
            >
              <span> {{ cpuUsage.loadAverage[0] }} </span>
              <span> {{ cpuUsage.loadAverage[1] }} </span>
              <span> {{ cpuUsage.loadAverage[2] }} </span>
            </div>
            <div class="bg-gray-200 rounded-full h-2">
              <div
                class="bg-red-500 rounded-full h-2"
                style-width="`${cpuUsage.loadAverage[0]}%`"
              ></div>
            </div>
            <na-chart
              bind-options="{animate:false}"
              bind-inputs="history.cpu"
              class="block bg-white rounded"
            ></na-chart>
          </st-panel>
        </div>

        <st-panel
          class="mb-6"
          icon="hard-drive"
          title="Disk Usage"
          on-refresh="refreshDisk()"
        >
          <div class="w-full overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Use
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Free
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Device
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider whitespace-nowrap"
                  >
                    Mounted on
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template for="disk of diskUsage">
                  <tr>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.used }} / {{ disk.total }}
                    </td>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.available }}
                    </td>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.device }}
                    </td>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.mountpoint }}
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </st-panel>
      </div>
    </template>
    <script type="module">
      import { ref, onInit, domReady, mount } from "@lithium/web";
      import "@sodium/na-chart";

      const oneMB = 1048576;
      const oneGB = oneMB * 1024;

      function setup() {
        const process = ref({});
        const cpuUsage = ref({
          loadAverage: [],
        });

        const memoryUsage = ref({
          used: 0,
          total: 0,
          free: 0,
        });

        const networkUsage = ref({
          download: 0,
          upload: 0,
        });

        const diskUsage = ref({
          total: 0,
          used: 0,
          available: 0,
          mountpoint: "/",
        });

        const history = ref({
          memory: {
            labels: Array(100).fill(""),
            datasets: [{ values: Array(100).fill(0) }],
          },
          cpu: {
            labels: Array(100).fill(""),
            datasets: [{ values: Array(100).fill(0) }],
          },
        });

        function refreshDisk() {
          return stat("/disk", diskUsage);
        }

        function refreshMemory() {
          return stat("/memory", memoryUsage);
        }

        function refreshCpu() {
          return stat("/cpu", cpuUsage);
        }

        function refreshNetwork() {
          return stat("/network", networkUsage);
        }

        function trimArray(array, size = 100) {
          return array.slice(-size);
        }

        async function refresh() {
          await refreshMemory();
          await refreshDisk();
          await refreshCpu();
          await refreshNetwork();

          const data = history.value;
          const now = new Date();
          const time = now.getHours() + ":" + now.getMinutes();

          data.memory.datasets[0].values.push(memoryUsage.value.used / oneMB);
          data.memory.labels.push(time);

          data.memory.datasets[0].values = trimArray(
            data.memory.datasets[0].values
          );

          data.memory.labels = trimArray(data.memory.labels);

          data.cpu.datasets[0].values.push(cpuUsage.value.loadAverage[0]);
          data.cpu.labels.push(time);

          data.cpu.datasets[0].values = trimArray(data.cpu.datasets[0].values);
          data.cpu.labels = trimArray(data.cpu.labels);

          history.value = { ...data };
        }

        function toDecimal(value) {
          return Number(value).toFixed(2);
        }

        async function stat(apiPath, target) {
          const req = await fetch(apiPath);
          target.value = await req.json();
        }

        onInit(() => {
          refresh();
          setInterval(refresh, 5000);
        });

        return {
          refresh,
          refreshCpu,
          refreshDisk,
          refreshMemory,
          refreshNetwork,
          toDecimal,
          cpuUsage,
          diskUsage,
          networkUsage,
          memoryUsage,
          history,
          process,
          oneMB,
          oneGB,
        };
      }

      domReady().then(function () {
        const template = document.querySelector("template");
        mount("body", { template, setup });
      });
    </script>
  </body>
</html>
