<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Stats</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://--li3.static.apphor.de/",
          "@sodium/": "https://--sodium.static.apphor.de/",
          "@lucide/": "https://--lucide.static.apphor.de/"
        }
      }
    </script>
    <script type="module">
      import "@li3/web";
      import "@lucide/lucide-icon";
    </script>
  </head>
  <body class="bg-gray-700 text-white">
    <template component="st-panel">
      <script setup>
        import { defineProp, defineEvent } from "@li3/web";

        export default function () {
          defineProp("icon");
          defineProp("title");
          const onRefresh = defineEvent("refresh");

          return { onRefresh };
        }
      </script>
      <div class="bg-white/10 p-6 rounded-lg shadow-md text-gray-200 h-full">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-medium">{{ title }}</h2>
          <button on-click="onRefresh()">
            <lucide-icon prop-icon="icon"></lucide-icon>
          </button>
        </div>
        <slot></slot>
      </div>
    </template>

    <template component="st-usage">
      <div class="text-2xl font-bold flex items-center justify-between">
        <span
          >{{ toDecimal(used) }} {{ unit }} / {{toDecimal(total) }} {{ unit
          }}</span
        >
        <span class="text-xs text-gray-300"
          >{{ toDecimal(free) }} {{ unit }} free</span
        >
      </div>
      <div class="mt-2 bg-gray-200 rounded-full h-2">
        <div
          class="bg-green-500 rounded-full h-2"
          style-width="`${ (used / total) * 100}%`"
        ></div>
      </div>
      <script setup>
        import { defineProp } from "@li3/web";

        export default function stUsage() {
          defineProp("total");
          defineProp("used");
          defineProp("free");
        }
      </script>
    </template>
    <template app>
      <div class="p-8 min-h-screen flex flex-col items-stretch">
        <h1 class="flex items-center justify-between w-full mb-6">
          <span class="text-3xl font-bold text-gray-100">Server Dashboard</span>
          <button class="cursor-pointer" on-click="autoUpdate()">
            <lucide-icon icon="refresh-cw"></lucide-icon>
          </button>
        </h1>

        <div class="grid gap-6 md:grid-cols-2 mb-6 w-full">
          <!-- lg:grid-cols-3 -->
          <!-- st-panel
            icon="network"
            title="Network Usage"
            on-refresh="refreshNetwork()"
          >
            <div class="text-2xl font-bold">
              {{ networkUsage.download | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↓ Download</p>
            <div class="mt-4 text-2xl font-bold">
              {{ networkUsage.upload | 0 }} Mbps
            </div>
            <p class="text-xs text-gray-500">↑ Upload</p>
          </st-panel -->

          <st-panel
            icon="memory-stick"
            title="Memory Usage"
            on-refresh="refreshMemory()"
          >
            <st-usage
              unit="MB"
              prop-used="memoryUsage.used / oneMB"
              prop-total="memoryUsage.total / oneMB"
              prop-free="memoryUsage.free / oneMB"
            ></st-usage>
            <na-chart
              bind-options="{animate:false, truncateLegends:true}"
              bind-inputs="history.memory"
              class="block bg-white rounded overflow-hidden mt-6"
            ></na-chart>
          </st-panel>

          <st-panel icon="cpu" title="CPU Usage" on-refresh="refreshCpu()">
            <div
              class="text-2xl mb-2 font-bold text-white flex items-center justify-between"
            >
              <span> {{ cpuUsage.loadAverage[0] }} </span>
              <span> {{ cpuUsage.loadAverage[1] }} </span>
              <span> {{ cpuUsage.loadAverage[2] }} </span>
            </div>
            <div class="bg-gray-200 rounded-full h-2 mb-6">
              <div
                class="bg-red-500 rounded-full h-2"
                style-width="`${cpuUsage.loadAverage[0] / cpuUsage.cpus.length * 100}%`"
              ></div>
            </div>
            <na-chart
              bind-inputs="history.cpu"
              class="block bg-white rounded overflow-hidden"
            ></na-chart>
          </st-panel>
        </div>

        <st-panel
          class="mb-6 w-full block"
          icon="hard-drive"
          title="Disk Usage"
          on-refresh="refreshDisk()"
        >
          <div class="w-full overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Device
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider whitespace-nowrap"
                  >
                    Mounted on
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Use
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <template for="disk of diskUsage">
                  <tr>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.device }}
                    </td>
                    <td class="p-2 whitespace-nowrap text-sm">
                      {{ disk.mountpoint }}
                    </td>
                    <td>
                      <st-usage
                        unit="disk.total.slice(-1) + 'B'"
                        prop-used="parseInt(disk.used)"
                        prop-total="parseInt(disk.total)"
                        prop-free="parseInt(disk.available)"
                      ></st-usage>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </st-panel>

        <st-panel
          class="mb-6 w-full block"
          icon="cpu"
          title="Top processes"
          on-refresh="refreshProcesses()"
        >
          <div class="w-full overflow-x-auto font-mono">
            <table class="w-full">
              <thead>
                <tr>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    pid
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    User
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    %CPU
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    %Mem
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Time
                  </th>
                  <th
                    class="p-3 text-left text-xs font-medium uppercase tracking-wider"
                  >
                    Command
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 text-sm whitespace-nowrap">
                <template for="process of ps">
                  <tr>
                    <td class="p-2">{{ process.pid }}</td>
                    <td class="p-2">{{ process.user }}</td>
                    <td class="p-2">{{ process.cpu }}</td>
                    <td class="p-2">{{ process.mem }}</td>
                    <td class="p-2">{{ process.time }}</td>
                    <td class="p-2">{{ process.command }}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </st-panel>
      </div>

      <script setup>
        import "@sodium/na-chart";
        import { ref, onInit } from "@li3/web";

        const oneMB = 1048576;
        const oneGB = oneMB * 1024;

        export default function statsApp() {
          const ps = ref("");
          const cpuUsage = ref({
            cpus: [],
            loadAverage: [],
          });

          const memoryUsage = ref({
            used: 0,
            total: 0,
            free: 0,
          });

          const networkUsage = ref({
            download: 0,
            upload: 0,
          });

          const diskUsage = ref({
            total: 0,
            used: 0,
            available: 0,
            mountpoint: "/",
          });

          const previousHistory = localStorage.getItem("history");
          const history = ref(
            previousHistory
              ? JSON.parse(previousHistory)
              : {
                  memory: {
                    labels: Array(100).fill(""),
                    datasets: [{ values: Array(100).fill(0) }],
                  },
                  cpu: {
                    labels: Array(100).fill(""),
                    datasets: [{ values: Array(100).fill(0) }],
                  },
                }
          );

          function refreshDisk() {
            return stat("/disk", diskUsage);
          }

          function refreshMemory() {
            return stat("/memory", memoryUsage);
          }

          function refreshCpu() {
            return stat("/cpu", cpuUsage);
          }

          function refreshNetwork() {
            return stat("/network", networkUsage);
          }

          function refreshProcesses() {
            return stat("/ps", ps);
          }

          function trimArray(array, size = 100) {
            return array.slice(-size);
          }

          async function refresh() {
            await refreshMemory();
            await refreshDisk();
            await refreshCpu();
            await refreshNetwork();
            await refreshProcesses();

            const data = history.value;
            const now = new Date();
            const time = now.getHours() + ":" + now.getMinutes();

            data.memory.datasets[0].values = trimArray([
              ...data.memory.datasets[0].values,
              memoryUsage.value.used / oneMB,
            ]);

            data.memory.labels = trimArray([...data.memory.labels, time]);

            data.cpu.datasets[0].values = trimArray([
              ...data.cpu.datasets[0].values,
              cpuUsage.value.loadAverage[0],
            ]);

            data.cpu.labels = trimArray([...data.cpu.labels, time]);

            history.value = { ...data };
            localStorage.setItem("history", JSON.stringify(history.value));
          }

          function toDecimal(value) {
            return Number(value).toFixed(2);
          }

          async function stat(apiPath, target) {
            const req = await fetch(apiPath);
            target.value = await req.json();
          }

          async function autoUpdate() {
            const req = await fetch("/auto-update");

            if (req.ok) {
              window.location.reload();
            }
          }

          onInit(() => {
            refresh();
            setInterval(refresh, 5000);
          });

          return {
            refresh,
            refreshCpu,
            refreshDisk,
            refreshMemory,
            refreshNetwork,
            refreshProcesses,
            toDecimal,
            autoUpdate,
            cpuUsage,
            diskUsage,
            networkUsage,
            memoryUsage,
            ps,
            history,
            oneMB,
            oneGB,
          };
        }
      </script>
    </template>
  </body>
</html>
